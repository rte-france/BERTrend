services:
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Proxy settings for build-time access (e.g. if you are behind a corporate proxy)
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - no_proxy=${no_proxy:-}
    container_name: bertrend-scheduler
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8882:8000"
    volumes:
      # Mount data directory for persistent SQLite database
      # Host path uses $HOME, container path uses /home/user
      - ${HOME}/.bertrend/db:/home/user/.bertrend/db
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-} # to avoid communication issues
      - no_proxy=${no_proxy:-} # to avoid communication issues
      # Application settings
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - MAX_WORKERS=100
      - HOME=/home/user  # Generic home path in container
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')" ]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 10s
      # Without start_interval the first probe only runs at t=interval (180s).
      # Requires Docker Engine >= 25.0.
      start_interval: 5s
    networks:
      - scheduler-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  scheduler-network:
    driver: bridge
