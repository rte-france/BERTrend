# Lightweight BERTrend deployment.
#
# Runs the BERTrend application together with RabbitMQ and the scheduler (both
# required by the prospective demo), but assumes the embedding server is already
# running elsewhere (another host/container/cluster). Unlike the full stack in
# docker-compose.yml, this variant does not build or start the embedding server.
# The app keeps a GPU reservation to speed up topic modelling; remove the
# `deploy:` block (and CUDA_VISIBLE_DEVICES) to run on a CPU-only host.
#
# It reuses the same image built from `Dockerfile` (no dedicated Dockerfile).
#
# Usage:
#   EMBEDDING_SERVICE_URL=https://your-embedding-host:6464 \
#   BERTREND_CLIENT_SECRET=your-secret \
#     docker compose -f docker-compose.lightweight.yml up -d
#
# If the embedding server sits on an intranet behind an HTTP proxy, add its host
# to NO_PROXY/no_proxy on the host before running: unlike the full stack, that
# server is no longer a compose service, so proxy traffic is not bypassed for it.
#
# Use the standard docker-compose.yml instead if you also want to run the
# embedding server locally.

services:
  # Main BERTrend application (embedding delegated to an external service)
  bertrend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend:latest
    container_name: bertrend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Start order: rabbitmq (healthy) -> scheduler (healthy) -> this app.
    depends_on:
      rabbitmq:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    ports:
      - "8081:8081"  # Prospective demo ("bertrend service")
      - "8083:8083"  # Topic Analysis demo
      - "8084:8084"  # Weak Signals demo
      - "8091:8091"  # Queue monitoring dashboard
      - "8881:8881"  # bertrend_apps FastAPI service (data scraping)
      - "8886:8886"  # Summary service
      - "8887:8887"  # Article scoring service
    volumes:
      - ${BERTREND_BASE_DIR:-.bertrend}:/bertrend
      - ${HF_HOME:-.cache/huggingface}:/app/.cache/huggingface
      # Streamlit secrets for the prospective demo's login (st.secrets["passwords"]).
      # They are gitignored, so they are absent both from the repo tarball and from
      # the `bertrend` wheel the image installs -- without this the demo raises
      # StreamlitSecretNotFoundError. /.streamlit is the container user's
      # HOME/.streamlit, the path streamlit names in that error, so mounting here
      # covers every streamlit app in the container regardless of its working dir.
      - ${STREAMLIT_SECRETS_FILE:-./bertrend/bertrend_apps/prospective_demo/.streamlit/secrets.toml}:/.streamlit/secrets.toml:ro
    # Supply the API keys / secrets / SMTP settings that live in .env but are not
    # listed in `environment:` below (SEMANTIC_SCHOLAR_API_KEY, NEWSCATCHER_API_KEY,
    # BERTREND_SECRET_KEY, SMTP_*, GMAIL_*, ...). Compose applies env_file BEFORE
    # `environment:`, so every container-specific value below still wins -- which
    # matters, because a host .env legitimately points at host-facing addresses
    # (RABBITMQ_HOST=<host>, BERTREND_BASE_DIR=/DSIA/..., *_SERVICE_URL=http://<host>)
    # that would break container-to-container traffic if they leaked in.
    # NB. deliberately NOT bind-mounted to /app/.env: run_demos.sh sources a .env
    # found there and exports it, which would defeat that precedence.
    env_file:
      - path: ${BERTREND_ENV_FILE:-.env}
        required: false
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},bertrend,rabbitmq,scheduler
      - no_proxy=${no_proxy:-},bertrend,rabbitmq,scheduler
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # Set HF_HOME inside container
      - HF_HOME=/app/.cache/huggingface
      # Set UV_CACHE_DIR to a location where the user has write permissions
      - UV_CACHE_DIR=/app/.cache/uv
      # Set NLTK_DATA to a location where the user has write permissions
      - NLTK_DATA=/app/nltk_data
      # BERTrend base dir
      - BERTREND_BASE_DIR=/bertrend/
      # Credentials used to authenticate against the external embedding server.
      # An empty value is NOT caught at startup (the client only rejects None), it
      # surfaces later as a 401 on /token, so require it here.
      - BERTREND_CLIENT_SECRET=${BERTREND_CLIENT_SECRET:?Set BERTREND_CLIENT_SECRET to the client secret of your external embedding server}
      # Use an externally-running embedding server (REQUIRED).
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL:?Set EMBEDDING_SERVICE_URL to the URL of your external embedding server}
      - EMBEDDING_SERVICE_USE_LOCAL=false
      # Execution queue (RabbitMQ) + scheduler service used by the prospective demo.
      # The scheduler fires jobs by calling back to this app's FastAPI service
      # (BERTREND_APPS_SERVICE_URL), which enqueues them to RabbitMQ for the workers.
      - RABBITMQ_HOST=rabbitmq
      # Must match the RABBITMQ_DEFAULT_USER/PASS given to the broker below,
      # otherwise the workers fall back to guest/guest and fail to authenticate.
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - SCHEDULER_SERVICE_TYPE=apscheduler
      - SCHEDULER_SERVICE_URL=http://scheduler:8000/
      - BERTREND_APPS_SERVICE_URL=http://bertrend:8881/
      # OpenAI environment variables (replace with your own values)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-5.6-luna}
    healthcheck:
      test: curl -f http://localhost:8081/_stcore/health && curl -f http://localhost:8083/_stcore/health && curl -f http://localhost:8084/_stcore/health || exit 1
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # GPU is used to speed up topic modelling (BERTopic / UMAP / HDBSCAN); the
    # embedding workload itself runs on the external embedding server. To run on
    # a CPU-only host, remove this `deploy:` block (and CUDA_VISIBLE_DEVICES above).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Use 1 GPU for the bertrend app
              capabilities: [ gpu ]

  # RabbitMQ broker backing the execution queue consumed by the in-container workers.
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: bertrend_rabbitmq
    ports:
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # APScheduler service that fires scheduled jobs (feed scraping, model training,
  # report generation) by calling back to the app's FastAPI service.
  scheduler:
    build:
      context: ./bertrend/services/scheduling
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend-scheduler:latest
    container_name: bertrend-scheduler
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Scheduler starts after the broker is ready.
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8882:8000"  # scheduler API / docs (the 8885 Job Viewer calls this)
    volumes:
      # Persist the APScheduler SQLite job store (host dir should be owned by HOST_UID).
      # The scheduler resolves its store as Path.home()/".bertrend"/"db" (see
      # services/scheduling/routers/scheduling.py), and HOME is /home/user in the
      # container -- so the host side must be the *invoking user's* ~/.bertrend/db,
      # which is where the job store already lives from running the service without
      # Docker. It is deliberately NOT under BERTREND_BASE_DIR (data/logs/config).
      # Override with SCHEDULER_DB_DIR if the store lives elsewhere.
      - ${SCHEDULER_DB_DIR:-${HOME}/.bertrend/db}:/home/user/.bertrend/db
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},bertrend,rabbitmq  # reach the app service without the proxy
      - no_proxy=${no_proxy:-},bertrend,rabbitmq
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - MAX_WORKERS=100
      - HOME=/home/user
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')" ]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 10s
      # Without start_interval the first probe only runs at t=interval (180s), so the
      # bertrend service -- which waits on `scheduler: service_healthy` -- would be
      # blocked for 3 minutes even though the scheduler is up in seconds.
      # Requires Docker Engine >= 25.0.
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # NiceGUI dashboard over the scheduler API (port 8885). It reuses the scheduler
  # image -- dashboard_scheduling.py lives in that source tree and needs only
  # requests + nicegui -- so it is a second entrypoint into the same build rather
  # than an image of its own. No `build:` here on purpose: the scheduler service
  # builds bertrend-scheduler:latest, and depends_on guarantees it exists first.
  job_viewer:
    image: bertrend-scheduler:latest
    container_name: bertrend-job-viewer
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "/app/bertrend/services/scheduling/dashboard_scheduling.py"]
    depends_on:
      scheduler:
        condition: service_healthy
    ports:
      - "8885:8885"  # Job Viewer UI
    # NiceGUI may write scratch state next to the working directory, and /app is
    # root-owned in the image while this runs as HOST_UID.
    working_dir: /tmp
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},bertrend,rabbitmq,scheduler,job_viewer
      - no_proxy=${no_proxy:-},bertrend,rabbitmq,scheduler,job_viewer
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      # Reach the scheduler over the compose network instead of the public
      # hostname the script defaults to.
      - SCHEDULER_JOBS_URL=http://scheduler:8000/jobs
    # The scheduler image's own HEALTHCHECK probes :8000, which this container
    # does not listen on -- override it to probe the dashboard's own port.
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8885/')" ]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
