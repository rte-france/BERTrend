# Lightweight BERTrend deployment.
#
# Runs the BERTrend application together with RabbitMQ and the scheduler (both
# required by the prospective demo), but assumes the embedding server is already
# running elsewhere (another host/container/cluster). Unlike the full stack in
# docker-compose.yml, this variant does not build or start the embedding server.
# The app keeps a GPU reservation to speed up topic modelling; remove the
# `deploy:` block (and CUDA_VISIBLE_DEVICES) to run on a CPU-only host.
#
# It reuses the same image built from `Dockerfile` (no dedicated Dockerfile).
#
# Usage:
#   EMBEDDING_SERVICE_URL=https://your-embedding-host:6464 \
#     docker compose -f docker-compose.lightweight.yml up -d
#
# Use the standard docker-compose.yml instead if you also want to run the
# embedding server locally.

services:
  # Main BERTrend application (embedding delegated to an external service)
  bertrend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend:latest
    container_name: bertrend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Start order: rabbitmq (healthy) -> scheduler (healthy) -> this app.
    depends_on:
      rabbitmq:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"  # Topic Analysis demo
      - "127.0.0.1:8084:8084"  # Weak Signals demo
      - "127.0.0.1:8081:8081"  # Prospective demo
    volumes:
      - ${BERTREND_BASE_DIR:-.bertrend}:/bertrend
      - ${HF_HOME:-.cache/huggingface}:/app/.cache/huggingface
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},bertrend,rabbitmq,scheduler
      - no_proxy=${no_proxy:-},bertrend,rabbitmq,scheduler
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # Set HF_HOME inside container
      - HF_HOME=/app/.cache/huggingface
      # Set UV_CACHE_DIR to a location where the user has write permissions
      - UV_CACHE_DIR=/app/.cache/uv
      # Set NLTK_DATA to a location where the user has write permissions
      - NLTK_DATA=/app/nltk_data
      # BERTrend base dir
      - BERTREND_BASE_DIR=/bertrend/
      - BERTREND_CLIENT_SECRET=${BERTREND_CLIENT_SECRET:-}
      # Use an externally-running embedding server (REQUIRED).
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL:?Set EMBEDDING_SERVICE_URL to the URL of your external embedding server}
      - EMBEDDING_SERVICE_USE_LOCAL=false
      # Execution queue (RabbitMQ) + scheduler service used by the prospective demo.
      # The scheduler fires jobs by calling back to this app's FastAPI service
      # (BERTREND_APPS_SERVICE_URL), which enqueues them to RabbitMQ for the workers.
      - RABBITMQ_HOST=rabbitmq
      - SCHEDULER_SERVICE_TYPE=apscheduler
      - SCHEDULER_SERVICE_URL=http://scheduler:8000/
      - BERTREND_APPS_SERVICE_URL=http://bertrend:8881/
      # OpenAI environment variables (replace with your own values)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-5.6-luna}
    healthcheck:
      test: curl -f http://localhost:8081/_stcore/health && curl -f http://localhost:8083/_stcore/health && curl -f http://localhost:8084/_stcore/health || exit 1
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # GPU is used to speed up topic modelling (BERTopic / UMAP / HDBSCAN); the
    # embedding workload itself runs on the external embedding server. To run on
    # a CPU-only host, remove this `deploy:` block (and CUDA_VISIBLE_DEVICES above).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Use 1 GPU for the bertrend app
              capabilities: [ gpu ]

  # RabbitMQ broker backing the execution queue consumed by the in-container workers.
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: bertrend_rabbitmq
    ports:
      - "127.0.0.1:15672:15672"  # management UI (optional)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # APScheduler service that fires scheduled jobs (feed scraping, model training,
  # report generation) by calling back to the app's FastAPI service.
  scheduler:
    build:
      context: ./bertrend/services/scheduling
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend-scheduler:latest
    container_name: bertrend-scheduler
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Scheduler starts after the broker is ready.
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8882:8000"  # scheduler API / docs (optional)
    volumes:
      # Persist the APScheduler SQLite job store (host dir should be owned by HOST_UID).
      - ${BERTREND_BASE_DIR:-.bertrend}/scheduler-db:/home/user/.bertrend/db
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=$NO_PROXY,bertrend,rabbitmq  # reach the app service without the proxy
      - no_proxy=$no_proxy,bertrend,rabbitmq
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - MAX_WORKERS=100
      - HOME=/home/user
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')" ]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
