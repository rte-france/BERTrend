services:
  # Embedding server service
  embedding_server:
    build:
      context: .
      dockerfile: Dockerfile.embedding_server
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend-embedding-server:latest
    container_name: bertrend-embedding-server
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "6464:6464"  # Embedding server API
    volumes:
      # Mount HF_HOME directory to share with host
      - ${HF_HOME:-.cache/huggingface}:/app/.cache/huggingface
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-}
      - no_proxy=${no_proxy:-}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # Ensure these are not empty strings
      - DEFAULT_RATE_LIMIT=${DEFAULT_RATE_LIMIT:-50}
      - DEFAULT_RATE_WINDOW=${DEFAULT_RATE_WINDOW:-60}
      # Set HF_HOME inside container
      - HF_HOME=/app/.cache/huggingface
      # Set UV_CACHE_DIR to a location where the user has write permissions
      - UV_CACHE_DIR=/app/.cache/uv
    healthcheck:
      test: curl --fail --insecure https://localhost:6464/health || exit 1
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 120s  # Longer start period as model loading can take time
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Use 1 GPU for the embedding server
              capabilities: [ gpu ]

  # Main BERTrend application
  bertrend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend:latest
    container_name: bertrend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Start order: rabbitmq (healthy) -> scheduler (healthy) -> this app.
    depends_on:
      embedding_server:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    ports:
      - "8081:8081"  # Prospective demo ("bertrend service")
      - "8083:8083"  # Topic Analysis demo
      - "8084:8084"  # Weak Signals demo
      - "8091:8091"  # Queue monitoring dashboard
      - "8881:8881"  # bertrend_apps FastAPI service (data scraping)
      - "8886:8886"  # Summary service
      - "8887:8887"  # Article scoring service
    volumes:
      - ${BERTREND_BASE_DIR:-.bertrend}:/bertrend
      - ${HF_HOME:-.cache/huggingface}:/app/.cache/huggingface
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},embedding_server,bertrend,rabbitmq,scheduler # to avoid communication issues between containers
      - no_proxy=${no_proxy:-},embedding_server,bertrend,rabbitmq,scheduler # to avoid communication issues between containers
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # Set HF_HOME inside container
      - HF_HOME=/app/.cache/huggingface
      # Set UV_CACHE_DIR to a location where the user has write permissions
      - UV_CACHE_DIR=/app/.cache/uv
      # Set NLTK_DATA to a location where the user has write permissions
      - NLTK_DATA=/app/nltk_data
      # BERTrend base dir
      - BERTREND_BASE_DIR=/bertrend/
      - BERTREND_CLIENT_SECRET=bd76aa472dd91aed4a56bf1935dbb802583c119824380d8567086579c0ef3324
      # Configure to use the embedding server
      - EMBEDDING_SERVICE_URL=https://embedding_server:6464
      - EMBEDDING_SERVICE_USE_LOCAL=false
      # Execution queue (RabbitMQ) + scheduler service used by the prospective demo.
      # The scheduler fires jobs by calling back to this app's FastAPI service
      # (BERTREND_APPS_SERVICE_URL), which enqueues them to RabbitMQ for the workers.
      - RABBITMQ_HOST=rabbitmq
      # Must match the RABBITMQ_DEFAULT_USER/PASS given to the broker below,
      # otherwise the workers fall back to guest/guest and fail to authenticate.
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - SCHEDULER_SERVICE_TYPE=apscheduler
      - SCHEDULER_SERVICE_URL=http://scheduler:8000/
      - BERTREND_APPS_SERVICE_URL=http://bertrend:8881/
      # OpenAI environment variables (replace with your own values)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-5.6-luna}
    healthcheck:
      test: curl -f http://localhost:8081/_stcore/health && curl -f http://localhost:8083/_stcore/health && curl -f http://localhost:8084/_stcore/health || exit 1
      interval: 120s
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1  # Use 1 GPU for the bertrend server
              capabilities: [ gpu ]

  # RabbitMQ broker backing the execution queue consumed by the in-container workers.
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: bertrend_rabbitmq
    ports:
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # APScheduler service that fires scheduled jobs (feed scraping, model training,
  # report generation) by calling back to the app's FastAPI service.
  scheduler:
    build:
      context: ./bertrend/services/scheduling
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${http_proxy:-}
        - https_proxy=${https_proxy:-}
        - NO_PROXY=${NO_PROXY:-}
        - no_proxy=${no_proxy:-}
    image: bertrend-scheduler:latest
    container_name: bertrend-scheduler
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Scheduler starts after the broker is ready.
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8882:8000"  # scheduler API / docs (the 8885 Job Viewer calls this)
    volumes:
      # Persist the APScheduler SQLite job store (host dir should be owned by HOST_UID).
      # The scheduler resolves its store as Path.home()/".bertrend"/"db" (see
      # services/scheduling/routers/scheduling.py), and HOME is /home/user in the
      # container -- so the host side must be the *invoking user's* ~/.bertrend/db,
      # which is where the job store already lives from running the service without
      # Docker. It is deliberately NOT under BERTREND_BASE_DIR (data/logs/config).
      # Override with SCHEDULER_DB_DIR if the store lives elsewhere.
      - ${SCHEDULER_DB_DIR:-${HOME}/.bertrend/db}:/home/user/.bertrend/db
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},bertrend,rabbitmq  # reach the app service without the proxy
      - no_proxy=${no_proxy:-},bertrend,rabbitmq
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - MAX_WORKERS=100
      - HOME=/home/user
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')" ]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 10s
      # Without start_interval the first probe only runs at t=interval (180s), so the
      # bertrend service -- which waits on `scheduler: service_healthy` -- would be
      # blocked for 3 minutes even though the scheduler is up in seconds.
      # Requires Docker Engine >= 25.0.
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # NiceGUI dashboard over the scheduler API (port 8885). It reuses the scheduler
  # image -- dashboard_scheduling.py lives in that source tree and needs only
  # requests + nicegui -- so it is a second entrypoint into the same build rather
  # than an image of its own. No `build:` here on purpose: the scheduler service
  # builds bertrend-scheduler:latest, and depends_on guarantees it exists first.
  job_viewer:
    image: bertrend-scheduler:latest
    container_name: bertrend-job-viewer
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "/app/bertrend/services/scheduling/dashboard_scheduling.py"]
    depends_on:
      scheduler:
        condition: service_healthy
    ports:
      - "8885:8885"  # Job Viewer UI
    # NiceGUI may write scratch state next to the working directory, and /app is
    # root-owned in the image while this runs as HOST_UID.
    working_dir: /tmp
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - NO_PROXY=${NO_PROXY:-},bertrend,rabbitmq,scheduler,job_viewer
      - no_proxy=${no_proxy:-},bertrend,rabbitmq,scheduler,job_viewer
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      # Reach the scheduler over the compose network instead of the public
      # hostname the script defaults to.
      - SCHEDULER_JOBS_URL=http://scheduler:8000/jobs
    # The scheduler image's own HEALTHCHECK probes :8000, which this container
    # does not listen on -- override it to probe the dashboard's own port.
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8885/')" ]
      interval: 180s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
